name: Diagnose web checks once

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: diagnose-web-once
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture web diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          report=.ci/web-diagnostics.txt
          : > "$report"

          run_check() {
            name="$1"
            shift
            log="$(mktemp)"
            printf '===== %s =====\n' "$name" >> "$report"
            "$@" >"$log" 2>&1
            code=$?
            cat "$log" >> "$report"
            printf '\nexit_code=%s\n\n' "$code" >> "$report"
            rm -f "$log"
          }

          run_check format pnpm format:check
          run_check lint pnpm lint
          run_check test pnpm test
          run_check build pnpm build

      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/web-diagnostics.txt
          git commit -m "ci: record web diagnostics"
          git push
