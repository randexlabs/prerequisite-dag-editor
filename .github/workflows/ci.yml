name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-workflow-restoration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Restore permanent workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore permanent CI definition
        run: git show 8e7c53d10666e197f39abe33b449d675c66c678f:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit final workflow
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'ci: restore permanent validation workflow'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    name: Web checks
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out final commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust checks
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out final commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.sha }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend tooling
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Install Rust toolchain components
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: Check Rust formatting
        run: pnpm rust:fmt:check

      - name: Run Clippy
        run: pnpm rust:clippy

      - name: Run Rust tests
        run: pnpm rust:test

  report:
    name: Full CI result
    needs:
      - finalize
      - web
      - rust
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ needs.finalize.outputs.sha }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          if [[ "$FINALIZE_RESULT" == "success" && "$WEB_RESULT" == "success" && "$RUST_RESULT" == "success" ]]; then
            state=success
            description="Permanent workflow, web, and Rust checks passed"
          else
            state=failure
            description="Workflow: $FINALIZE_RESULT; Web: $WEB_RESULT; Rust: $RUST_RESULT"
          fi

          target_sha="${FINAL_SHA:-$GITHUB_SHA}"

          jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            --arg context "ci/full" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$target_sha" \
            --data @status.json

          [[ "$state" == "success" ]]
