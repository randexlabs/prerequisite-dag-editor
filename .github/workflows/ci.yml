name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend tooling
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Install Rust toolchain components
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: Check Rust formatting
        run: pnpm rust:fmt:check

      - name: Run Clippy
        run: pnpm rust:clippy

      - name: Run Rust tests
        run: pnpm rust:test

  cleanup:
    name: Apply canvas cleanup
    needs:
      - web
      - rust
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Transform canvas UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          def sub_once(source: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, source, count=1, flags=re.DOTALL | re.MULTILINE)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return result

          app_path = Path("src/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          for symbol in ("Controls", "useReactFlow", "Maximize2", "PanelLeftClose", "PanelLeftOpen"):
              app = sub_once(app, rf"^\s*{symbol},\n", "", f"remove {symbol} import")

          app = replace_once(
              app,
              'import { decorateEdgesForHighlight } from "./components/graph-presentation";\n',
              'import { decorateEdgesForHighlight } from "./components/graph-presentation";\n'
              'import { getWorkspaceShortcut } from "./components/keyboard-shortcuts";\n',
              "workspace shortcut import",
          )
          app = replace_once(
              app,
              "const fitViewOptions = { padding: 0.24 } as const;\n",
              "const fitViewOptions = { padding: 0.24 } as const;\n"
              "const proOptions = { hideAttribution: true } as const;\n",
              "React Flow attribution option",
          )
          app = sub_once(app, r"^\s*const \{ fitView \} = useReactFlow\(\);\n", "", "fitView hook")
          app = sub_once(
              app,
              r"^\s*const \[browserOpen, setBrowserOpen\] = useState\(true\);\n",
              "",
              "browser visibility state",
          )
          app = sub_once(
              app,
              r"  useEffect\(\(\) => \{\n\s*const handleKeyDown = \(event: KeyboardEvent\) => \{.*?"
              r"  \}, \[addNode, clearSelection, deleteSelected, fitView, redo, selectedElementCount, undo\]\);\n",
              '''  useEffect(() => {
            const handleKeyDown = (event: KeyboardEvent) => {
              const target = event.target as HTMLElement | null;
              const action = getWorkspaceShortcut(event, {
                isEditing: Boolean(
                  target?.matches("input, textarea, select, [contenteditable='true']"),
                ),
                hasSelection: selectedElementCount > 0,
              });

              switch (action) {
                case "undo":
                  event.preventDefault();
                  undo();
                  return;
                case "redo":
                  event.preventDefault();
                  redo();
                  return;
                case "clear-selection":
                  event.preventDefault();
                  clearSelection();
                  return;
                case "delete-selection":
                  event.preventDefault();
                  deleteSelected();
                  return;
                case "add-topic":
                  event.preventDefault();
                  addNode();
                  return;
                default:
                  return;
              }
            };

            window.addEventListener("keydown", handleKeyDown);
            return () => window.removeEventListener("keydown", handleKeyDown);
          }, [addNode, clearSelection, deleteSelected, redo, selectedElementCount, undo]);
''',
              "workspace keyboard effect",
          )
          app = sub_once(
              app,
              r"  const addTopic = \(\) => \{\n\s*addNode\(\);\n\s*setBrowserOpen\(true\);\n\s*\};\n",
              "  const addTopic = () => {\n    addNode();\n  };\n",
              "add topic action",
          )
          app = replace_once(
              app,
              '          panActivationKeyCode="Space"\n',
              '          panActivationKeyCode={null}\n',
              "keyboard pan",
          )
          app = replace_once(
              app,
              "          fitViewOptions={fitViewOptions}\n",
              "          fitViewOptions={fitViewOptions}\n          proOptions={proOptions}\n",
              "attribution prop",
          )
          app = sub_once(
              app,
              r"^\s*<Controls className=\"canvas-controls\" showInteractive=\{false\} />\n",
              "",
              "React Flow controls",
          )
          app = sub_once(
              app,
              r"\n\s*<div className=\"brand-pill floating-surface\">.*?</div>\n\n(?=\s*<nav className=\"tool-dock)",
              "\n",
              "brand pill",
          )
          app = sub_once(
              app,
              r"\n\s*<button\n\s*type=\"button\"\n\s*className=\"tool-button\"\n"
              r"\s*onClick=\{\(\) => void fitView\(\{ padding: 0\.24, duration: 240 \}\)\}\n"
              r"\s*aria-label=\"Fit graph to view\"\n\s*title=\"Fit to view \(F\)\"\n"
              r"\s*>\n\s*<Maximize2 size=\{18\} />\n\s*<kbd>F</kbd>\n\s*</button>",
              "",
              "fit view toolbar action",
          )
          app = sub_once(
              app,
              r"\s*\{browserOpen \? \(\n\s*(<aside className=\"floating-panel topic-browser\" aria-label=\"Topic browser\">)",
              r"\n      \1",
              "topic browser opening conditional",
          )
          app = sub_once(
              app,
              r"\s*</aside>\n\s*\) : null\}",
              "\n      </aside>",
              "topic browser closing conditional",
          )
          app = sub_once(
              app,
              r"\n\s*<div className=\"canvas-hint floating-surface\">.*?</div>\n\n(?=\s*\{cycleMessage)",
              "\n",
              "canvas interaction hint",
          )

          for token in (
              "brand-pill",
              "canvas-controls",
              "canvas-hint",
              "Fit graph to view",
              "useReactFlow",
              "browserOpen",
              "setBrowserOpen",
              'panActivationKeyCode="Space"',
          ):
              if token in app:
                  raise RuntimeError(f"App.tsx still contains {token!r}")

          app_path.write_text(app, encoding="utf-8")

          styles_path = Path("src/styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          styles = re.sub(r"^\s*--xy-controls-button-[^\n]+\n", "", styles, flags=re.MULTILINE)

          for pattern, label in (
              (r"\n\.react-flow__attribution \{.*?\n\}\n", "attribution styles"),
              (
                  r"\n\.brand-pill \{.*?\n\}\n\n\.brand-mark \{.*?\n\}\n\n"
                  r"\.brand-copy \{.*?\n\}\n\n\.brand-copy strong \{.*?\n\}\n\n"
                  r"\.brand-copy span \{.*?\n\}\n",
                  "brand styles",
              ),
              (
                  r"\n\.canvas-controls \{.*?\n\}\n\n\.canvas-controls button \{.*?\n\}\n\n"
                  r"\.canvas-controls button:hover \{.*?\n\}\n\n\.canvas-controls svg \{.*?\n\}\n",
                  "control styles",
              ),
              (
                  r"\n\.canvas-hint \{.*?\n\}\n\n\.canvas-hint span \{.*?\n\}\n",
                  "hint styles",
              ),
              (r"\n@media \(max-width: 980px\) \{.*?\n\}\n", "hint media query"),
          ):
              styles = sub_once(styles, pattern, "\n", label)

          styles = replace_once(styles, "  top: 76px;\n", "  top: var(--space-3);\n", "browser top")
          styles = replace_once(styles, "  bottom: 68px;\n", "  bottom: var(--space-3);\n", "browser bottom")
          styles = replace_once(styles, "  bottom: 64px;\n", "  bottom: var(--space-3);\n", "minimap bottom")
          styles = re.sub(r"^\s*\.brand-copy,\n", "", styles, flags=re.MULTILINE)
          styles = re.sub(r"\n\s*\.brand-pill \{.*?\n\s*\}\n", "\n", styles, count=1, flags=re.DOTALL)
          styles = re.sub(r"\n\s*\.canvas-controls \{.*?\n\s*\}\n", "\n", styles, count=1, flags=re.DOTALL)

          for token in ("brand-pill", "brand-copy", "brand-mark", "canvas-controls", "canvas-hint"):
              if token in styles:
                  raise RuntimeError(f"styles.css still contains {token!r}")

          styles_path.write_text(styles, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "- **Move the canvas:** drag with the middle mouse button. `Space` plus left drag remains available as an alternative.\n",
              "- **Move the canvas:** drag with the middle mouse button.\n",
              "README pan instructions",
          )
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and validate transformed web application
        run: |
          pnpm format
          pnpm lint
          pnpm test
          pnpm build

      - name: Delete obsolete branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin agent/initial-project-setup >/dev/null 2>&1; then
            git push origin --delete agent/initial-project-setup
          fi

          if git ls-remote --exit-code --heads origin agent/initial-project-setup >/dev/null 2>&1; then
            echo "Obsolete branch still exists." >&2
            exit 1
          fi

      - name: Commit canvas cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css README.md
          git commit -m "refactor: remove redundant canvas chrome"
          git push

  report:
    name: Full CI result
    needs:
      - web
      - rust
      - cleanup
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        shell: bash
        run: |
          if [[ "$WEB_RESULT" == "success" && "$RUST_RESULT" == "success" && "$CLEANUP_RESULT" == "success" ]]; then
            state=success
            description="Web, Rust, and canvas cleanup passed"
          else
            state=failure
            description="Web: $WEB_RESULT; Rust: $RUST_RESULT; cleanup: $CLEANUP_RESULT"
          fi

          jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            --arg context "ci/full" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data @status.json

          [[ "$state" == "success" ]]
