name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-cleanup-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Finalize repository cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove obsolete canvas styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/styles.css')
          css = path.read_text(encoding='utf-8')
          css = re.sub(r'^\s*--xy-controls-button-[^\n]+\n', '', css, flags=re.MULTILINE)

          for pattern in (
              r'\n\.react-flow__attribution \{.*?\n\}\n',
              r'\n\.brand-pill \{.*?\n\}\n\n\.brand-mark \{.*?\n\}\n\n\.brand-copy \{.*?\n\}\n\n\.brand-copy strong \{.*?\n\}\n\n\.brand-copy span \{.*?\n\}\n',
              r'\n\.canvas-controls \{.*?\n\}\n\n\.canvas-controls button \{.*?\n\}\n\n\.canvas-controls button:hover \{.*?\n\}\n\n\.canvas-controls svg \{.*?\n\}\n',
              r'\n\.canvas-hint \{.*?\n\}\n\n\.canvas-hint span \{.*?\n\}\n',
              r'\n@media \(max-width: 980px\) \{.*?\n\}\n',
          ):
              css = re.sub(pattern, '\n', css, count=1, flags=re.DOTALL)

          css = css.replace(
              '  .selection-summary,\n  .tool-button kbd,\n  .brand-copy {\n',
              '  .selection-summary,\n  .tool-button kbd {\n',
          )
          css = re.sub(r'\n\s*\.brand-pill \{.*?\n\s*\}\n', '\n', css, count=1, flags=re.DOTALL)
          css = re.sub(r'\n\s*\.canvas-controls \{.*?\n\s*\}\n', '\n', css, count=1, flags=re.DOTALL)

          for token in ('brand-pill', 'brand-mark', 'brand-copy', 'canvas-controls', 'canvas-hint'):
              if token in css:
                  raise SystemExit(f'stale selector remains: {token}')

          path.write_text(css, encoding='utf-8')
          PY

      - name: Verify obsolete branch is gone
        run: |
          if git ls-remote --exit-code --heads origin agent/initial-project-setup >/dev/null 2>&1; then
            echo 'Obsolete branch still exists.' >&2
            exit 1
          fi

      - name: Format source
        run: |
          pnpm format
          pnpm rust:fmt

      - name: Commit formatted source
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- . ':(exclude).github/workflows/**'

          if ! git diff --cached --quiet; then
            git commit -m 'style: format simplified canvas UI'
            git push
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    name: Web checks
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out formatted source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cleanup.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust checks
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out formatted source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cleanup.outputs.sha }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend tooling
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Install Rust toolchain components
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: Check Rust formatting
        run: pnpm rust:fmt:check

      - name: Run Clippy
        run: pnpm rust:clippy

      - name: Run Rust tests
        run: pnpm rust:test

  report:
    name: Full CI result
    needs:
      - cleanup
      - web
      - rust
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ needs.cleanup.outputs.sha }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          if [[ "$CLEANUP_RESULT" == "success" && "$WEB_RESULT" == "success" && "$RUST_RESULT" == "success" ]]; then
            state=success
            description="Cleanup, web, and Rust checks passed"
          else
            state=failure
            description="Cleanup: $CLEANUP_RESULT; Web: $WEB_RESULT; Rust: $RUST_RESULT"
          fi

          target_sha="${FINAL_SHA:-$GITHUB_SHA}"

          jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            --arg context "ci/full" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$target_sha" \
            --data @status.json

          [[ "$state" == "success" ]]
