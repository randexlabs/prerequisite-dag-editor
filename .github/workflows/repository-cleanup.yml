name: Repository cleanup

on:
  push:
    branches:
      - main
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run cleanup and capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          report=.ci/cleanup-report.md
          : > "$report"

          printf '# Repository cleanup report\n\n' >> "$report"
          printf 'Commit: `%s`\n\n' "$GITHUB_SHA" >> "$report"

          run_step() {
            name="$1"
            shift
            log="$(mktemp)"
            printf '## %s\n\n```text\n' "$name" >> "$report"
            "$@" >"$log" 2>&1
            code=$?
            cat "$log" >> "$report"
            printf '\n```\n\nExit code: `%s`\n\n' "$code" >> "$report"
            rm -f "$log"
            return 0
          }

          run_shell_step() {
            name="$1"
            command="$2"
            run_step "$name" bash -o pipefail -c "$command"
          }

          run_shell_step "Install Linux dependencies" "sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf"
          run_step "Install dependencies" pnpm install --no-frozen-lockfile
          run_step "Install Rust components" rustup component add clippy rustfmt
          run_step "Generate Tauri icons" pnpm icons
          run_step "Prettier write" pnpm format
          run_step "ESLint fix" pnpm lint:fix
          run_step "Prettier write after ESLint" pnpm format
          run_step "Rustfmt write" pnpm rust:fmt
          run_step "Prettier check" pnpm format:check
          run_step "ESLint check" pnpm lint
          run_step "Web tests" pnpm test
          run_step "Web build" pnpm build
          run_step "Rustfmt check" pnpm rust:fmt:check
          run_step "Clippy" pnpm rust:clippy
          run_step "Rust tests" pnpm rust:test
          run_step "Git diff summary" git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: apply automated repository cleanup"
          git push
