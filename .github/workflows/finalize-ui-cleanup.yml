name: Finalize UI cleanup once

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  finalize:
    if: github.event.issue.title == 'Run final canvas cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Remove obsolete styles and branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/styles.css')
          css = path.read_text(encoding='utf-8')

          css = re.sub(r'^\s*--xy-controls-button-[^\n]+\n', '', css, flags=re.MULTILINE)

          blocks = [
              r'\n\.react-flow__attribution \{.*?\n\}\n',
              r'\n\.brand-pill \{.*?\n\}\n\n\.brand-mark \{.*?\n\}\n\n\.brand-copy \{.*?\n\}\n\n\.brand-copy strong \{.*?\n\}\n\n\.brand-copy span \{.*?\n\}\n',
              r'\n\.canvas-controls \{.*?\n\}\n\n\.canvas-controls button \{.*?\n\}\n\n\.canvas-controls button:hover \{.*?\n\}\n\n\.canvas-controls svg \{.*?\n\}\n',
              r'\n\.canvas-hint \{.*?\n\}\n\n\.canvas-hint span \{.*?\n\}\n',
              r'\n@media \(max-width: 980px\) \{.*?\n\}\n',
          ]

          for pattern in blocks:
              css = re.sub(pattern, '\n', css, count=1, flags=re.DOTALL)

          css = re.sub(r'^\s*\.brand-copy,\n', '', css, flags=re.MULTILINE)
          css = re.sub(r'\n\s*\.brand-pill \{.*?\n\s*\}\n', '\n', css, count=1, flags=re.DOTALL)
          css = re.sub(r'\n\s*\.canvas-controls \{.*?\n\s*\}\n', '\n', css, count=1, flags=re.DOTALL)

          for token in ('brand-pill', 'brand-mark', 'brand-copy', 'canvas-controls', 'canvas-hint'):
              if token in css:
                  raise SystemExit(f'stale selector remains: {token}')

          path.write_text(css, encoding='utf-8')
          PY

          if git ls-remote --exit-code --heads origin agent/initial-project-setup >/dev/null 2>&1; then
            git push origin --delete agent/initial-project-setup
          fi

          if git ls-remote --exit-code --heads origin agent/initial-project-setup >/dev/null 2>&1; then
            echo 'Obsolete branch still exists.' >&2
            exit 1
          fi

      - name: Format final repository
        run: |
          pnpm format
          pnpm rust:fmt

      - name: Create final commit
        id: final_commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-ui-cleanup.yml
          git add --all

          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize canvas cleanup'
            git push
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run complete validation
        id: validation
        continue-on-error: true
        run: pnpm check

      - name: Publish final CI status
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          if [[ "$VALIDATION_OUTCOME" == 'success' ]]; then
            state=success
            description='Complete web and Rust validation passed'
          else
            state=failure
            description='Complete validation failed'
          fi

          jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            --arg context 'ci/full' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json

          curl --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            --data @status.json

          curl --fail-with-body \
            --request PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}" \
            --data '{"state":"closed","state_reason":"completed"}'

          [[ "$state" == 'success' ]]
