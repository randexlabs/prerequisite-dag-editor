name: Finalize permanent CI

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  finalize:
    name: Restore and verify final main
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore permanent workflow and remove verifier
        run: |
          git show 8e7c53d10666e197f39abe33b449d675c66c678f:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/finalize-permanent-ci.yml

      - name: Commit final repository state
        id: final_commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'ci: restore permanent validation workflow'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Run complete validation
        id: validation
        continue-on-error: true
        run: pnpm check

      - name: Publish final CI status
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          if [[ "$VALIDATION_OUTCOME" == 'success' ]]; then
            state=success
            description='Complete web and Rust validation passed'
          else
            state=failure
            description='Complete validation failed'
          fi

          jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            --arg context 'ci/full' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}' \
            > status.json

          curl --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            --data @status.json

          [[ "$state" == 'success' ]]
