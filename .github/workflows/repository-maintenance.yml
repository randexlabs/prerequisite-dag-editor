name: Repository maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Apply formatters and safe lint fixes
        run: |
          pnpm format
          pnpm lint:fix
          pnpm format
          pnpm rust:fmt

      - name: Commit mechanical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style: format repository"
            git push
          fi

      - name: Run complete validation and record result
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          pnpm check > .ci/maintenance.log 2>&1
          code=$?
          {
            printf 'exit_code=%s\n' "$code"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'completed_at=%s\n' "$(date -u +%FT%TZ)"
          } > .ci/maintenance-status.txt
          tail -n 200 .ci/maintenance.log > .ci/maintenance-log-tail.txt
          git add .ci/maintenance-status.txt .ci/maintenance-log-tail.txt
          git commit -m "ci: record repository maintenance result"
          git push
          exit "$code"
