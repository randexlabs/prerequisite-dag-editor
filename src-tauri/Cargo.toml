[package]
name = "prerequisite-dag-editor"
version = "0.1.0"
description = "A local-first prerequisite DAG editor"
authors = ["cayasde"]
edition = "2021"

[lib]
name = "prerequisite_dag_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
